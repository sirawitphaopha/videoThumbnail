[package]
name = "movie-shelf"
version = "0.1.0"
description = "ชั้นหนัง โปรแกรมใส่โปสเตอร์ในไฟล์หนัง"
edition = "2024"
rust-version = "1.90"

[lib]
name = "movie_shelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
# เรียกคำสั่งของ Windows ตรง ๆ · ส่งหน้าต่างเทสไปอยู่หลังสุด · Job Object ให้เครื่องมือตายตามโปรแกรม (TECH-REVIEW ข้อ 9)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }
# ค่า hash ของปกและไฟล์หนัง (ขั้น 2 ปก · ขั้น 5 ขั้น 6 ทั้งไฟล์)
sha2 = "0.10"
# ค่า hash อีก 3 แบบของหน้าข้อมูลไฟล์ (ขั้น 5 · สเปกข้อ 6) MD5 SHA-1 CRC32 · อ่านไฟล์รอบเดียวคิดพร้อมกันทุกแบบ
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
# รูปโปสเตอร์ (ขั้น 4 · TECH-REVIEW ข้อ 10) อ่าน JPG PNG WebP BMP TIFF หมุนตามข้อมูลกล้อง · HEIC ให้ ffmpeg ถอดก่อน
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
# แปลงสีตามโปรไฟล์ในรูป (Display P3 ของไอโฟน Adobe RGB) เป็น sRGB ไม่ให้ภาพซีด
qcms = "0.3"
# เข้ารหัส JPG แบบตารางฮัฟแมนที่คำนวณจากรูปจริง ไฟล์เล็กกว่าตัวเข้ารหัสของ image
jpeg-encoder = "0.6"

# งานรูปและ hash ช้าลง 10–30 เท่าในโหมดทดสอบ ถ้าไม่เปิดตัวเลือกนี้ (TECH-REVIEW ข้อ 10)
[profile.dev.package."*"]
opt-level = 3

# โค้ดย่อรูปกับเข้ารหัส JPG เป็นแบบทั่วไป (generic) ถูกสร้างในตัวโปรแกรมเอง ไม่ใช่ในส่วนประกอบ
# ไม่เปิดตัวนี้ หน้าต่างครอปคิดขนาดไฟล์ช้า 1.5 วินาทีต่อครั้งในโหมดทดสอบ (วัดแล้ว ขั้น 4)
[profile.dev.package.movie-shelf]
opt-level = 2
